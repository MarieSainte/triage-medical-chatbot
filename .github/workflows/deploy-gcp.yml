name: CI/CD — Deploy to RunPod

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run evaluation
        env:
          ADAPTER_PATH: "NONE"
          EVAL_SAMPLE_LIMIT: "5"
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers peft accelerate safetensors requests
          python test_CI/eval_model.py

      - name: Set image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/medical-chatbot-api' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      # Redémarre le pod RunPod pour qu'il pull la nouvelle image :latest.
      # Si le pod est déjà éteint, continue-on-error évite de bloquer la CI.
      - name: Restart RunPod Pod
        continue-on-error: true
        run: |
          echo "Arret du pod..."
          curl -s -X POST \
            "https://api.runpod.io/graphql?api_key=${{ secrets.RUNPOD_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"query": "mutation { podStop(input: { podId: \"${{ secrets.RUNPOD_POD_ID }}\" }) { id currentState } }"}'

          echo "Attente arrêt complet..."
          sleep 15

          echo "Redemarrage du pod (pull :latest automatique)..."
          curl -s -X POST \
            "https://api.runpod.io/graphql?api_key=${{ secrets.RUNPOD_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"query": "mutation { podResume(input: { podId: \"${{ secrets.RUNPOD_POD_ID }}\", gpuCount: 1 }) { id currentState } }"}'
